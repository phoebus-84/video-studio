# JSON Schema for Skill Frontmatter
# Validate with: npx ajv validate -s schemas/skill-frontmatter.schema.yaml -d <skill.md frontmatter as JSON>
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://video-built-in-pipelines/schemas/skill-frontmatter"
title: "Skill Frontmatter"
description: "Schema for YAML frontmatter in SKILL.md files"
type: object
required: [skill, progressive_disclosure, inputs]
additionalProperties: false
properties:
  skill:
    type: object
    required: [id, pipeline, stage, version, kind]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        description: "Stable skill ID matching manifest skills[].skill"
      pipeline:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        description: "Pipeline ID this skill belongs to"
      stage:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        description: "Stage ID this skill implements"
      version:
        type: string
        pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
        description: "Semver version string"
      kind:
        type: string
        enum: [producer, reviewer, mixed]
        description: "Skill kind: producer, reviewer, or mixed"

  progressive_disclosure:
    type: object
    required: [summary]
    additionalProperties: false
    properties:
      summary:
        type: string
        minLength: 1
        description: "One-paragraph summary of what the skill does"
      prerequisites:
        type: array
        items:
          type: object
          required: [contract, version]
          additionalProperties: false
          properties:
            contract:
              type: string
            version:
              type: string
              pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
      knowledge:
        type: array
        items:
          type: object
          required: [ref]
          additionalProperties: false
          properties:
            ref:
              type: string

  inputs:
    type: array
    minItems: 1
    items:
      type: object
      required: [contract, version, required]
      additionalProperties: false
      properties:
        contract:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
        required:
          type: boolean
        description:
          type: string

  outputs:
    type: array
    items:
      type: object
      required: [contract, version, required]
      additionalProperties: false
      properties:
        contract:
          type: string
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
        required:
          type: boolean
        description:
          type: string

  review:
    type: object
    required: [checklist, format, produces]
    additionalProperties: false
    properties:
      checklist:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, description, severity]
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            description:
              type: string
              minLength: 1
            severity:
              type: string
              enum: [error, warning, info]
      format:
        type: string
        enum: [structured, freeform, pass-fail]
      produces:
        type: array
        items:
          type: object
          required: [contract, version]
          additionalProperties: false
          properties:
            contract:
              type: string
            version:
              type: string
              pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'

  metadata:
    type: object
    additionalProperties: false
    properties:
      author:
        type: string
      created:
        type: string
      tags:
        type: array
        items:
          type: string
