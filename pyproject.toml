[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen-tts-worker"
version = "1.0.0"
description = "Persistent local Qwen3-TTS worker on Apple Silicon via MLX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "phoebus-84" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.25",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=4.1",
]
mlx = [
    "mlx-audio[tts]==0.4.6",
    "huggingface-hub>=1.0,<2",
]
diagnostics = [
    "mlx-whisper==0.4.3",
]
docs = [
    "mkdocs==1.6.1",
]

[project.scripts]
qwen-tts-worker = "qwen_tts_worker.__main__:main"
qwen-tts = "qwen_tts_worker.user_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_tts_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/qwen_tts_worker"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
