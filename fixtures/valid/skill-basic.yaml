# Stage One: Input Normalization

## Purpose

Normalize the source input into a structured intermediate artifact.

## Instructions

1. Load the source input contract.
2. Verify all required fields are present.
3. Apply defaults for optional fields.
4. Validate field types against the contract schema.
5. Produce the intermediate artifact.
