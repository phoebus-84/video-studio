# JSON Schema for Pipeline Manifests
# Validate with: npx ajv validate -s schemas/pipeline-manifest.schema.yaml -d <manifest.yaml>
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://video-built-in-pipelines/schemas/pipeline-manifest"
title: "Pipeline Manifest"
description: "Schema for pipeline manifest files at pipelines/<pipeline-id>/manifest.yaml"
type: object
required: [pipeline]
additionalProperties: false
properties:
  pipeline:
    type: object
    required: [id, version, stages]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        description: "Stable, unique pipeline ID in lowercase-hyphen format"
      version:
        type: string
        pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
        description: "Semver version string"
      description:
        type: string
        description: "Human-readable pipeline description"
      capabilities:
        type: array
        items:
          type: object
          required: [id, version]
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            version:
              type: string
              pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
      stages:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, name, capability, inputs, outputs, gates, depends_on]
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
              description: "Stable stage ID; never rename after publication"
            name:
              type: string
              minLength: 1
            description:
              type: string
            capability:
              type: string
              pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            inputs:
              type: array
              items:
                type: object
                required: [contract, version, source]
                additionalProperties: false
                properties:
                  contract:
                    type: string
                    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
                  version:
                    type: string
                    pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
                  source:
                    type: string
                    enum: [upstream, series-local]
                    description: "Or pattern: prior-stage.<stage-id>"
            outputs:
              type: array
              items:
                type: object
                required: [contract, version]
                additionalProperties: false
                properties:
                  contract:
                    type: string
                    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
                  version:
                    type: string
                    pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
            gates:
              type: object
              required: [autopilot, review, retry_on_failure]
              additionalProperties: false
              properties:
                autopilot:
                  type: boolean
                review:
                  type: string
                  enum: [none, human, skill, human-or-skill]
                retry_on_failure:
                  type: integer
                  minimum: 0
                budget:
                  type: object
                  additionalProperties: false
                  properties:
                    wall_time:
                      type: string
                    tokens:
                      type: integer
                      minimum: 0
            skills:
              type: array
              items:
                type: object
                required: [skill, version]
                additionalProperties: false
                properties:
                  skill:
                    type: string
                    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
                  version:
                    type: string
                    pattern: '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
            depends_on:
              type: array
              items:
                type: string
                pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            parallelizable_group:
              type: [string, "null"]
