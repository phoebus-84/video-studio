name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      # This private repository has no GitHub code-scanning entitlement. Keep
      # analysis in CI, but do not fail after a successful scan on SARIF upload.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'bandit==1.9.4'
      - run: bandit -q -r src/qwen_tts_worker -ll

  dependency-audit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit --requirement requirements.txt
