name: Voice CPU live smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths: ["packages/voice/**", ".github/workflows/voice-smoke.yml"]

permissions:
  contents: read

jobs:
  cpu:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'voice-live-smoke')
    name: Official Qwen CPU (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QTW_BACKEND: torch
      QTW_DEVICE: cpu
      QTW_RUN_TORCH_SMOKE: "1"
      QTW_TORCH_SMOKE_MODEL: ${{ github.workspace }}/packages/voice/models/qwen3-tts-0.6b-customvoice-torch
      QTW_SMOKE_REPORT: ${{ runner.temp }}/voice-cpu-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU wheels explicitly (no CUDA packages)
        run: |
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "packages/voice[dev,torch]"
      - name: Download the explicitly selected, pinned public checkpoint
        run: qwen-tts install 0.6B --models-dir packages/voice/models
      - name: Real offline CPU synthesis in English and Italian
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest packages/voice/tests/test_torch_opt_in_smoke.py -q -s
      - uses: actions/upload-artifact@v4
        with:
          name: voice-cpu-measurements
          path: ${{ runner.temp }}/voice-cpu-report.json
          if-no-files-found: error
