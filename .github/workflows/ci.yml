name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && python -m pip install '.[dev,docs]'
      - run: python -m compileall -q src/qwen_tts_worker
      - run: pytest -q
      - run: mkdocs build --strict --site-dir /tmp/qtw-doc-site

  macos-mlx-import:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps .
          python -m pip install pytest pytest-asyncio httpx pytest-cov
          python -m pip check
      - run: python -c 'import mlx, mlx_audio; print(mlx.__version__)'
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
