name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural invariants. These are cheap and they are why the rest of CI can
  # be trusted: no absolute paths (the bug that made the predecessor layout
  # uninstallable), no packages/ -> studio/ dependency, generated docs current.
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run check:paths
      - run: npm run check:boundaries
      - run: npm run docs:check

  # The docs site build is also a link checker: VitePress fails on a dead
  # internal link, which catches a renamed page or a moved component doc.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
          retention-days: 7

  # Every profile must resolve. A profile that names a component or skill set
  # that no longer exists is a broken install for whoever picks it.
  compose:
    name: Compose (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, studio, headless, voice, render]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run compose -- --profile=${{ matrix.profile }}

  modules:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/codex-image
          - packages/fal-media
          - packages/graphics
          - packages/terminal-recorder
          - packages/infographics
          - packages/video-composer
          - packages/remotion-composer
          - studio/contracts
          - studio/series
          - studio/episode
          - studio/runtime
          - studio/pipelines
          - studio/adapters
          - studio/agent
          - studio/gateway
          - studio/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # FFmpeg 7 or later (ADR-0047: `-/filter_complex` reads a graph from a
      # file). Ubuntu's package is 6.1, so take a static 9.0 build, the branch
      # the operator's machine runs, checked against the release's checksums.
      - name: Install media tooling
        env:
          FFMPEG_BUILD: ffmpeg-n9.0-latest-linux64-gpl-9.0
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$FFMPEG_BUILD.tar.xz"
          curl -fsSL "$base/checksums.sha256" | grep " $FFMPEG_BUILD.tar.xz\$" | sha256sum -c -
          tar -xf "$FFMPEG_BUILD.tar.xz"
          echo "$RUNNER_TEMP/$FFMPEG_BUILD/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$FFMPEG_BUILD/bin/ffmpeg" -hide_banner -version | head -1

      - run: bun install --frozen-lockfile

      # The kit lock test compares kits.lock.json with main's: released kit
      # versions must stay locked and unchanged.
      - name: fetch main for the kit lock
        if: matrix.module == 'packages/remotion-composer'
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: typecheck
        working-directory: ${{ matrix.module }}
        run: npm run --if-present typecheck

      - name: test
        working-directory: ${{ matrix.module }}
        run: npm run --if-present test

  voice:
    name: packages/voice (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MLX is Apple-Silicon only, so CI verifies the package is importable and
      # its tests collect, not that synthesis runs.
      - name: Collect tests
        working-directory: packages/voice
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest --collect-only -q || echo "::warning::voice tests not collectable on Linux CI"
