name: Qwen TTS documentation

on:
  workflow_dispatch:
    inputs:
      review_release_tag:
        description: "Optional release tag containing candidate-qtw-v1-listening-review.tar.gz"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build documentation
        run: |
          python -m pip install 'mkdocs==1.6.1'
          mkdocs build --strict --site-dir site
          touch site/.nojekyll
      - name: Download blinded review package
        if: ${{ inputs.review_release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TAG: ${{ inputs.review_release_tag }}
        run: |
          gh release download "$REVIEW_TAG" --pattern 'candidate-qtw-v1-listening-review.tar.gz' --dir /tmp/review
          test "$(find /tmp/review -type f | wc -l | tr -d ' ')" = 1
      - name: Verify and stage blinded review
        if: ${{ inputs.review_release_tag != '' }}
        run: |
          PYTHONPATH=src python evaluation/package_listening_review.py verify \
            --archive /tmp/review/candidate-qtw-v1-listening-review.tar.gz \
            --destination site/listening/candidate-qtw-v1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
